# SPACE prove-out — implements section 2.4 of the Lane B2 zero-cost sourcing
# paper exactly. Vehicle: standard GitHub-hosted runner (ubuntu-24.04) on this
# PUBLIC scratch repository — free and unlimited; no secrets anywhere.
#
# Vendor pins are taken from perplexityai/SPACE's own source (read 2026-10-18):
#   - infra/space/kind/scripts/install-fc-vendor.sh: FC_VERSION default
#     v1.15.1; release tarball at github.com/firecracker-microvm/firecracker;
#     guest kernel firecracker-ci/v1.15/x86_64/vmlinux-6.1.155 from
#     s3.amazonaws.com/spec.ccfc.min, pinned sha256 e20e46d0... (also the E0
#     kernel digest in docs/runtime-manager-catalog.md).
#   - Guest rootfs: ubuntu-24.04.squashfs from the same firecracker-ci/v1.15
#     prefix (the vendor artifact path); the pinned 6.1.155 kernel config has
#     CONFIG_SQUASHFS=y, CONFIG_SERIAL_8250_CONSOLE=y, CONFIG_VIRTIO_BLK=y.
#
# v2 (confirmation run only): stage 1's kill path captures the jailer exit
# code instead of dying on it — in run 39168602101 the guest ignored
# `poweroff -f`, the harness pkill landed, and `wait` returning 143 under
# `bash -e` failed the step AFTER every decision-bearing event had succeeded
# (marker + guest uname are in that run's uploaded console log). Nothing else
# differs from v1.
name: SPACE prove-out

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FC_VERSION: v1.15.1
  FC_TGZ_URL: https://github.com/firecracker-microvm/firecracker/releases/download/v1.15.1/firecracker-v1.15.1-x86_64.tgz
  KERNEL_URL: https://s3.amazonaws.com/spec.ccfc.min/firecracker-ci/v1.15/x86_64/vmlinux-6.1.155
  KERNEL_SHA256: e20e46d0c36c55c0d1014eb20576171b3f3d922260d9f792017aeff53af3d4f2
  ROOTFS_URL: https://s3.amazonaws.com/spec.ccfc.min/firecracker-ci/v1.15/x86_64/ubuntu-24.04.squashfs

jobs:
  stage0-device-gate:
    name: Stage 0 — device gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Device facts
        run: |
          set -x
          uname -m
          egrep -c '(vmx|svm)' /proc/cpuinfo || true
          free -m
          df -h
          ls -la /dev/kvm
          ls -la /dev/net/tun || echo "/dev/net/tun ABSENT"
      - name: Install cpu-checker and run kvm-ok
        run: |
          sudo apt-get update
          sudo apt-get install -y cpu-checker
          sudo kvm-ok || kvm-ok
      - name: Enable KVM (udev rule — android-emulator-runner canonical step)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Assert /dev/kvm readable and writable
        run: |
          set -euxo pipefail
          ls -la /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          echo "STAGE0_KVM_OK"

  stage1-firecracker:
    name: Stage 1 — Firecracker primitive (decision-bearing)
    needs: stage0-device-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Enable KVM (fresh runner — same step as stage 0)
        run: |
          set -euxo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          df -h
      - name: Fetch pinned vendor artifacts (SPACE E0 — Firecracker v1.15.1, kernel 6.1.155)
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/vendor"
          cd "$RUNNER_TEMP/vendor"
          curl -fsSL --retry 5 --retry-all-errors "$FC_TGZ_URL" -o fc.tgz
          sha256sum fc.tgz | tee fc.tgz.sha256
          tar -xzf fc.tgz
          install -m 0755 "release-${FC_VERSION}-x86_64/firecracker-${FC_VERSION}-x86_64" firecracker
          install -m 0755 "release-${FC_VERSION}-x86_64/jailer-${FC_VERSION}-x86_64" jailer
          ./firecracker --version
          ./jailer --version
          sha256sum firecracker jailer | tee binaries.sha256
          curl -fsSL --retry 5 --retry-all-errors "$KERNEL_URL" -o vmlinux.bin
          echo "$KERNEL_SHA256  vmlinux.bin" | sha256sum -c -
          curl -fsSL --retry 5 --retry-all-errors "$ROOTFS_URL" -o ubuntu-24.04.squashfs
          sha256sum vmlinux.bin ubuntu-24.04.squashfs | tee guest.sha256
          df -h
      - name: Boot one microVM via Firecracker + jailer (1 vCPU / 512 MiB)
        run: |
          set -uxo pipefail
          V="$RUNNER_TEMP/vendor"
          JAIL=/srv/jailer
          ID=proveout1
          CHROOT="$JAIL/firecracker/$ID/root"
          sudo mkdir -p "$CHROOT"
          sudo cp "$V/vmlinux.bin" "$V/ubuntu-24.04.squashfs" "$CHROOT/"
          FIFO="$RUNNER_TEMP/fc.stdin"
          mkfifo "$FIFO"
          CONSOLE="$RUNNER_TEMP/console.log"
          : > "$CONSOLE"
          sudo "$V/jailer" --id "$ID" --exec-file "$V/firecracker" \
            --uid "$(id -u)" --gid "$(id -g)" --chroot-base-dir "$JAIL" \
            < "$FIFO" > "$CONSOLE" 2>&1 &
          JPID=$!
          exec 3>"$FIFO"
          SOCK="$CHROOT/run/firecracker.socket"
          for i in $(seq 1 60); do [ -S "$SOCK" ] && break; sleep 0.5; done
          ls -la "$SOCK" || echo "API SOCKET MISSING"
          api() { sudo curl -sS --unix-socket "$SOCK" -X PUT "$1" -H 'Content-Type: application/json' -d "$2" -w ' -> HTTP %{http_code}\n'; }
          api http://localhost/boot-source '{"kernel_image_path":"/vmlinux.bin","boot_args":"console=ttyS0 reboot=k panic=1 pci=off root=/dev/vda rootfstype=squashfs init=/bin/sh"}'
          api http://localhost/drives/rootfs '{"drive_id":"rootfs","path_on_host":"/ubuntu-24.04.squashfs","is_root_device":true,"is_read_only":true}'
          api http://localhost/machine-config '{"vcpu_count":1,"mem_size_mib":512}'
          api http://localhost/actions '{"action_type":"InstanceStart"}'
          sleep 8
          printf 'echo SPACE_HELLO_OK\n' >&3
          sleep 1
          printf 'uname -a\n' >&3
          sleep 2
          printf 'poweroff -f\n' >&3
          sleep 5
          exec 3>&-
          for i in $(seq 1 20); do kill -0 "$JPID" 2>/dev/null || break; sleep 1; done
          if kill -0 "$JPID" 2>/dev/null; then sudo pkill -f "jailer --id $ID" || true; sleep 2; fi
          JPID_EXIT=0
          wait "$JPID" 2>/dev/null || JPID_EXIT=$?
          echo "jailer/firecracker exit code: $JPID_EXIT (143 expected: harness pkill after the guest rootfs ignored poweroff)"
          echo '===== GUEST CONSOLE LOG ====='
          cat "$CONSOLE"
          echo '===== END GUEST CONSOLE LOG ====='
          df -h
      - name: Assert guest hello marker and guest uname
        run: |
          set -euxo pipefail
          LOG="$RUNNER_TEMP/console.log"
          M=$(grep -n -m1 'SPACE_HELLO_OK' "$LOG" | cut -d: -f1)
          U=$(grep -n -P -m1 '^Linux (?!version\b)\S+ 6\.1\.155' "$LOG" | cut -d: -f1)
          echo "marker line: $M ; guest uname line: $U"
          [ -n "$M" ] && [ -n "$U" ] && [ "$U" -gt "$M" ]
          echo "STAGE1_MARKER_OK"
      - name: Upload console log and checksums
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-console
          path: |
            ${{ runner.temp }}/console.log
            ${{ runner.temp }}/vendor/fc.tgz.sha256
            ${{ runner.temp }}/vendor/binaries.sha256
            ${{ runner.temp }}/vendor/guest.sha256
          if-no-files-found: warn

  stage2-space-full:
    name: Stage 2 — full SPACE via vendor guide (stretch)
    needs: stage0-device-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    # Stretch stage: its failure is a runner-fit result and must never
    # redden the run's verdict (section 2.4).
    continue-on-error: true
    steps:
      - name: Enable KVM (fresh runner — same step as stage 0)
        run: |
          set -euxo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          df -h
          free -m
      - name: Checkout perplexityai/SPACE
        uses: actions/checkout@v4
        with:
          repository: perplexityai/SPACE
          path: SPACE
      - name: Vendor host checks (installation guide)
        working-directory: SPACE
        run: |
          (
            set -euo pipefail
            case "$(uname -s):$(uname -m)" in
              Linux:x86_64) ;;
              *)
                printf 'Use a Linux x86_64 host with KVM, not macOS.\n' >&2
                exit 1
                ;;
            esac
            for device in /dev/kvm /dev/net/tun; do
              if [[ ! -c "$device" ]]; then
                printf 'Required device is unavailable: %s\n' "$device" >&2
                exit 1
              fi
            done
            if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
              printf 'The current user needs read and write access to /dev/kvm.\n' >&2
              exit 1
            fi
            if [[ ! -f infra/space/kind/scripts/install-prereqs.sh ]]; then
              printf 'Run this block from the SPACE checkout root.\n' >&2
              exit 1
            fi
            missing=0
            for tool in git curl tar openssl python3 ssh-keygen docker; do
              if ! command -v "$tool" >/dev/null; then
                printf 'Missing host tool: %s\n' "$tool" >&2
                missing=1
              fi
            done
            if (( missing != 0 )); then
              printf 'Install all missing host tools before continuing.\n' >&2
              exit 1
            fi
            docker version --format '{{.Server.Version}}' >/dev/null
            printf 'Host checks passed.\n'
          )
      - name: Install prerequisite tools (installation guide)
        working-directory: SPACE
        run: |
          export INSTALL_DIR="$HOME/.local/bin"
          export PATH="$INSTALL_DIR:$PATH"
          (
            set -euo pipefail
            mkdir -p "$INSTALL_DIR"
            login_rc="$HOME/.profile"
            for rc in "$HOME/.bash_profile" "$HOME/.bash_login"; do
              if [[ -f "$rc" ]]; then
                login_rc="$rc"
                break
              fi
            done
            path_line='case ":$PATH:" in *":$HOME/.local/bin:"*) ;; *) export PATH="$HOME/.local/bin:$PATH" ;; esac'
            for rc in "$login_rc" "$HOME/.bashrc"; do
              touch "$rc"
              if ! grep -Fxq "$path_line" "$rc"; then
                printf '\n%s\n' "$path_line" >> "$rc"
              fi
            done
            installer_status=0
            time bash infra/space/kind/scripts/install-prereqs.sh ||
              installer_status=$?
            missing=0
            for tool in kind kubectl helm grpcurl tilt go jq; do
              if ! command -v "$tool"; then
                printf 'Missing from PATH: %s\n' "$tool" >&2
                missing=1
              fi
            done
            if (( installer_status != 0 || missing != 0 )); then
              printf 'Installation is incomplete. Resolve all errors above.\n' >&2
              exit 1
            fi
            printf 'Tool checks passed.\n'
          )
          df -h
      - name: Install Firecracker vendor tree and bootstrap (installation guide)
        working-directory: SPACE
        run: |
          unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
          unset DD_API_KEY EPPO_SDK_KEY
          export SPACE_VENDOR_ROOT="$HOME/.local/share/space/vendor"
          export SPACE_KIND_CLUSTER=space-local
          export PATH="$HOME/.local/bin:$PATH"
          (
            set -euo pipefail
            time bash infra/space/kind/scripts/install-fc-vendor.sh
            df -h
            time bash infra/space/kind/scripts/bootstrap.sh
          )
          df -h
      - name: Verify installation — seed job and node-service rollouts (installation guide)
        working-directory: SPACE
        run: |
          export SPACE_API_URL=http://127.0.0.1:8080
          export SPACE_DATA_PLANE_URL=http://127.0.0.1:8090
          export PATH="$HOME/.local/bin:$PATH"
          (
            set -euo pipefail
            kubectl --context kind-space-local -n space get pods
            kubectl --context kind-space-local -n space \
              wait --for=condition=complete \
              job/space-seed-publish --timeout=300s
            for ds in $(bash infra/space/kind/lib/node-services.sh daemonsets); do
              kubectl --context kind-space-local -n space \
                rollout status "ds/$ds" --timeout=300s
            done
            curl --noproxy '*' --fail-with-body --silent --show-error \
              --max-time 15 \
              "$SPACE_API_URL/openapi-m1.json" |
              jq -e '.openapi and .paths' >/dev/null
          )
      - name: Authenticate and create first sandbox (installation + first-sandbox guides)
        working-directory: SPACE
        run: |
          export SPACE_API_URL=http://127.0.0.1:8080
          export SPACE_DATA_PLANE_URL=http://127.0.0.1:8090
          export PATH="$HOME/.local/bin:$PATH"
          set +x
          authenticate() {
            SPACE_API_TOKEN="$(
              SPACE_CONSOLE_PASSWORD="${SPACE_CONSOLE_PASSWORD:-password}" \
                jq -nc '{email:"root@local",password:env.SPACE_CONSOLE_PASSWORD}' |
              curl --noproxy '*' --fail-with-body --silent --show-error \
                --max-time 15 \
                -H 'Content-Type: application/json' \
                --data-binary @- \
                "$SPACE_API_URL/auth/v1/sessions" |
                jq -er '.token | select(type == "string" and length > 0)'
            )" || {
              unset SPACE_API_TOKEN
              return 1
            }
            export SPACE_API_TOKEN
            curl --noproxy '*' --fail-with-body --silent --show-error \
              --max-time 15 \
              -H "Authorization: Bearer $SPACE_API_TOKEN" \
              "$SPACE_API_URL/v1/sandboxes?limit=1" |
              jq '{data, next_cursor}'
          }
          authenticate
          printf 'y\n' | python3 examples/first_sandbox.py 2>&1 | tee "$RUNNER_TEMP/first-sandbox.log"
          grep -q 'Hello from SPACE' "$RUNNER_TEMP/first-sandbox.log"
          grep -q 'Command completed successfully' "$RUNNER_TEMP/first-sandbox.log"
          echo "STAGE2_SANDBOX_OK"
      - name: Upload first-sandbox log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage2-first-sandbox
          path: ${{ runner.temp }}/first-sandbox.log
          if-no-files-found: warn
